name: CI

# Code sanity checks for every push and pull request. Deploys stay in deploy.yml;
# protect main with these jobs as required status checks so a red build cannot ship.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate checklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Project checklist, deploy shape, dependency audit, llms sync
        run: bash .agent/skills/validate/run.sh

  html:
    name: HTML validity (W3C Nu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download the Nu HTML Checker
        run: curl -sSfL -o "$RUNNER_TEMP/vnu.jar" https://github.com/validator/validator/releases/download/latest/vnu.jar
      - name: Check index.html (errors fail the build)
        run: java -jar "$RUNNER_TEMP/vnu.jar" --errors-only index.html
      - name: Report warnings (informational)
        run: java -jar "$RUNNER_TEMP/vnu.jar" index.html || true

  smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Click through the app in headless Chrome
        env:
          CHROME: google-chrome
        run: bash tests/smoke.sh

  lint:
    name: Lint scripts and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: shellcheck
        run: shellcheck .agent/skills/*/run.sh tests/*.sh
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
      - name: JavaScript syntax
        run: |
          awk '/^<script>$/{on=1; next} /^<\/script>$/{on=0} on' index.html > "$RUNNER_TEMP/app.js"
          node --check "$RUNNER_TEMP/app.js"
          node --check tests/smoke-harness.js
          node --check .agent/skills/sync-content/generate.js
      - name: Machine-readable files parse
        run: |
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml')"
          python3 - <<'PY'
          import json, re, pathlib
          html = pathlib.Path('index.html').read_text()
          block = re.search(r'<script type="application/ld\+json">(.*?)</script>', html, re.S).group(1)
          graph = {node['@type']: node for node in json.loads(block)['@graph']}
          assert len(graph['WebApplication']['featureList']) == 8
          assert graph['ItemList']['numberOfItems'] == 8
          assert len(graph['FAQPage']['mainEntity']) >= 5
          print('JSON-LD OK:', ', '.join(graph))
          PY
      - name: Images are the expected sizes
        run: |
          python3 - <<'PY'
          import struct
          def png_size(path):
              with open(path, 'rb') as f:
                  head = f.read(24)
              return struct.unpack('>II', head[16:24])
          expected = {'icon-512.png': (512, 512), 'icon-192.png': (192, 192), 'apple-touch-icon.png': (180, 180)}
          for path, size in expected.items():
              assert png_size(path) == size, (path, png_size(path))
          print('icons OK')
          PY
